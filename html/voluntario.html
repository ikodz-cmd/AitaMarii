<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de voluntariado</title>
    <link rel="stylesheet" href="../css/voluntario.css">

</head>

<body>
    <header>
        <nav>
            <a class="header" href="index.html">Inicio</a>
            <a class="header" href="#">¿Quienes somos?</a>
            <a class="header" href="#">Rutas</a>
            <a class="header" href="voluntariado.html">Voluntariado</a>
            <a class="btn" href="#">Iniciar Sesión</a>
        </nav>
    </header>

    <section class="contenedor">
        <form class="formulario" action="#" method="post">
            <h2>Envíanos un email</h2>
            <label for="nombre">Nombre y apellidos</label>
            <input type="text" name="nombre" id="nombre" placeholder="Nombre y Apelido">
            <label for="correo">Correo electrónico</label>
            <input type="email" name="correo" id="correo" placeholder="Correo electrónico">
            <label for="telefono">Teléfono</label>
            <input type="tel" name="telefono" id="telefono" placeholder="Teléfono">
            <select id="puesto" name="puesto">
                <option value="" selected disabled>Selecciona una opción</option>
                <option value="Socorrista">Socorrista</option>
                <option value="Patrón">Patrón</option>
                <option value="Mariner@">Mariner@</option>
                <option value="Sanitario">Sanitario</option>
                <option value="Otros">Otros</option>
            </select>

            <button type="submit">Enviar formulario</button>
        </form>
    </section>



    <footer>
        <a href="#" class="redes"><img src="../img/instagram.png" alt="Instagram"></a>
        <a href="#" class="redes"><img src="../img/facebook.png" alt="Facebook"></a>
        <a href="#" class="redes"><img src="../img/x.png" alt="Twitter"></a>
        <p>2026 Aita Mari. Todos los derechos reservados.</p>
    </footer>
</body>

</html>
