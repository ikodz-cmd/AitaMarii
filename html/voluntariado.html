<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de voluntariado</title>
</head>

<body>
    <form>
        <fieldset>
            <legend>Formulario de voluntariado</legend>

            <label for="nombre">Nombre y apellidos</label><br>
            <input id="nombre" name="nombre" type="text" required><br>

            <label for="correo">Correo electrónico</label><br>
            <input id="correo" name="correo" type="email" required><br>

            <input id="rescate" name="area" type="radio" value="rescate">
            <label for="rescate">Socorrista</label><br>
            <input id="ayuda" name="area" type="radio" value="ayuda">
            <label for="ayuda">Marinero</label><br>
            <input id="logistica" name="area" type="radio" value="logistica">
            <label for="logistica">Sanitario</label><br>

            <input id="bicicleta" name="transporte" type="checkbox" value="bicicleta">
            <label for="bicicleta">Bici</label><br>
            <input id="coche" name="transporte" type="checkbox" value="coche">
            <label for="coche">Coche</label><br>

            <label for="provincia">Provincia</label><br>
            <select id="provincia" name="provincia">
                <option value="alava">Álava</option>
                <option value="bizkaia">Bizkaia</option>
                <option value="gipuzkoa">Gipuzkoa</option>
            </select>
            <input aria-label="Fecha disponible" name="fecha" type="date">
            <input aria-label="Hora disponible" name="hora" type="time"><br>

            <label for="telefono">Teléfono</label><br>
            <input id="telefono" name="telefono" type="tel"><br>

            <input id="terminos" name="terminos" type="checkbox" required>
            <label for="terminos">Acepto los términos y condiciones</label><br>

            <button type="submit">Enviar</button>
            <button type="reset">Reset</button>
            <button type="button">Haz clic!</button>
        </fieldset>
    </form>
</body>

</html>
